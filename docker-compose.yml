
services:
  postgres:
    image: postgres:17
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ./backend/.volumes/postgres/data:/var/lib/postgresql/data
      # - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=tienda_de_musica


  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
    command: http-server -p 8080 --cors
