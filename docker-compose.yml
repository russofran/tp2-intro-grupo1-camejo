
services:
  postgres:
    image: postgres:17
    container_name: postgres_db_tienda
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - ./.volumes/postgres/data:/var/lib/postgresql/data
      # - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=tienda_de_musica

  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "3030:3030"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=tienda_de_musica
    command: npm run dev

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
    command: http-server -p 8080 --cors
